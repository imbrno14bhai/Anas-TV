name: Build AnasTV Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anas_tv_flutter/**'
      - '.github/workflows/build-anas-tv-apk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: anas_tv_flutter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-anas-tv-${{ runner.os }}-${{ hashFiles('anas_tv_flutter/pubspec.yaml') }}
          restore-keys: |
            gradle-anas-tv-${{ runner.os }}-

      - name: Generate Android project files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.anas.tv .
          fi

      - name: Install native Media3 player
        run: |
          rm -rf android/app/src/main/kotlin/com/anas/tv/anas_tv
          mkdir -p android/app/src/main/kotlin/com/anas/tv
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/anas/tv/MainActivity.kt
          cp android_native/Media3PlayerView.kt android/app/src/main/kotlin/com/anas/tv/Media3PlayerView.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find Android app Gradle file")
          s = gradle.read_text()
          s = re.sub(r'(?m)^\s*namespace\s*=?\s*["\'][^"\']+["\']',
                     '    namespace = "com.anas.tv"', s)
          s = re.sub(r'(?m)^\s*applicationId\s*=?\s*["\'][^"\']+["\']',
                     '        applicationId = "com.anas.tv"', s)
          deps = [
              '    implementation("androidx.media3:media3-exoplayer:1.11.1")',
              '    implementation("androidx.media3:media3-exoplayer-dash:1.11.1")',
              '    implementation("androidx.media3:media3-exoplayer-hls:1.11.1")',
              '    implementation("androidx.media3:media3-ui:1.11.1")',
          ]
          if "androidx.media3:media3-exoplayer:" not in s:
              block = "dependencies {\n" + "\n".join(deps) + "\n"
              if "dependencies {" in s:
                  s = s.replace("dependencies {", block, 1)
              else:
                  s += "\n" + block + "}\n"
          gradle.write_text(s)
          PY

      - name: Ensure Android network permissions and cleartext traffic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-feature android:name="android.software.leanback" android:required="false" />',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          if 'LEANBACK_LAUNCHER' not in s:
              s = re.sub(
                  r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                  r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
                  s,
                  count=1
              )
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\b', '<application\n        android:usesCleartextTraffic="true"', s, count=1)
          s = re.sub(r'android:label="[^"]+"', 'android:label="AnasTV"', s, count=1)
          p.write_text(s)
          PY

      - name: Bundle Jio loader asset
        run: |
          mkdir -p assets/images
          if [ -f ../public/assets/aistudio/jio_b70b9fac.svg ]; then
            cp ../public/assets/aistudio/jio_b70b9fac.svg assets/images/jio_logo.svg
          fi
          if [ -f ../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg ]; then
            cp ../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg assets/images/jio_loader.jpg
          fi

      - name: Add Google Maven Central mirror to avoid 429 rate limits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mirror_line = '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          for rel in ["android/settings.gradle.kts", "android/build.gradle.kts"]:
              p = Path(rel)
              if not p.exists():
                  continue
              s = p.read_text()
              if "maven-central.storage-download.googleapis.com" not in s and "mavenCentral()" in s:
                  s = s.replace("mavenCentral()", mirror_line.strip() + "\n        mavenCentral()")
                  p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release || (sleep 10 && flutter build apk --release)

      - name: Upload AnasTV Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: anas-tv-release-apk
          path: anas_tv_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
