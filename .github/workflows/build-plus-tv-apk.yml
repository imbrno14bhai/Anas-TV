name: Build PlusTV Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [PlusTV]
    paths:
      - 'anas_tv_flutter/**'
      - '.github/workflows/build-plus-tv-apk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: anas_tv_flutter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PlusTV source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-plus-tv-${{ runner.os }}-${{ hashFiles('anas_tv_flutter/pubspec.yaml') }}
          restore-keys: |
            gradle-plus-tv-${{ runner.os }}-

      - name: Generate Android project files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.plustv.app .
          fi

      - name: Install PlusTV native Media3 player
        run: |
          rm -rf android/app/src/main/kotlin/com/plustv/app
          mkdir -p android/app/src/main/kotlin/com/plustv/app
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/plustv/app/MainActivity.kt
          cp android_native/Media3PlayerView.kt android/app/src/main/kotlin/com/plustv/app/Media3PlayerView.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find Android app Gradle file")
          s = gradle.read_text()
          s = re.sub(r'(?m)^\\s*namespace\\s*=?\\s*["\\'][^"\\']+["\\']',
                     '    namespace = "com.plustv.app"', s)
          s = re.sub(r'(?m)^\\s*applicationId\\s*=?\\s*["\\'][^"\\']+["\\']',
                     '        applicationId = "com.plustv.app"', s)
          deps = [
              '    implementation("androidx.media3:media3-exoplayer:1.3.1")',
              '    implementation("androidx.media3:media3-exoplayer-dash:1.3.1")',
              '    implementation("androidx.media3:media3-exoplayer-hls:1.3.1")',
              '    implementation("androidx.media3:media3-ui:1.3.1")',
          ]
          if "androidx.media3:media3-exoplayer:" not in s:
              block = "dependencies {\\n" + "\\n".join(deps) + "\\n"
              if "dependencies {" in s:
                  s = s.replace("dependencies {", block, 1)
              else:
                  s += "\\n" + block + "}\\n"
          gradle.write_text(s)
          PY

      - name: Ensure Android network and TV support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-feature android:name="android.software.leanback" android:required="false" />',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\\n    <application', 1)
          if 'LEANBACK_LAUNCHER' not in s:
              s = re.sub(
                  r'(<category\\s+android:name="android\\.intent\\.category\\.LAUNCHER"\\s*/>)',
                  r'\\1\\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
                  s,
                  count=1
              )
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\\b', '<application\\n        android:usesCleartextTraffic="true"', s, count=1)
          s = re.sub(r'android:label="[^"]+"', 'android:label="PlusTV"', s, count=1)
          p.write_text(s)
          PY

      - name: Add Google Maven Central mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mirror_line = '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          for rel in ["android/settings.gradle.kts", "android/build.gradle.kts"]:
              p = Path(rel)
              if not p.exists():
                  continue
              s = p.read_text()
              if "maven-central.storage-download.googleapis.com" not in s and "mavenCentral()" in s:
                  s = s.replace("mavenCentral()", mirror_line.strip() + "\\n        mavenCentral()")
                  p.write_text(s)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build PlusTV release APK
        run: flutter build apk --release || (sleep 10 && flutter build apk --release)

      - name: Upload PlusTV APK
        uses: actions/upload-artifact@v4
        with:
          name: plus-tv-release-apk
          path: anas_tv_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
